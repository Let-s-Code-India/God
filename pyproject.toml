[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godaix"
version = "1.0.1"
description = "Resilient AI tooling with decorators, coding analysis, provider resilience, and integrations"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Ayush Giri" }]
dependencies = [
  "rich>=13.7",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "openai>=1.0",
  "anthropic>=0.30",
  "google-generativeai>=0.8",
  "groq>=0.6",
  "flask>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pytest>=7.0",
]
keywords = ["ai", "llm", "resilience", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/ayushgiriai21-cmd/God"
Repository = "https://github.com/ayushgiriai21-cmd/God"

[project.scripts]
godai = "godai.apex:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]