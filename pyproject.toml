[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "god-ai"
version = "1.0.0"
description = "A hybrid terminal assistant and Python SDK with local LLM support"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "God AI Contributors" }]
dependencies = [
  "rich>=13.7",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "pydantic>=2.0",
  "google-generativeai>=0.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
keywords = ["ai", "llm", "ollama", "automation", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ayushgiriai21-cmd/God"
Repository = "https://github.com/ayushgiriai21-cmd/God"

[project.optional-dependencies]
examples = ["numpy>=1.24", "torch>=2.0", "fastapi>=0.110", "requests>=2.31", "pytest>=7.0"]

[project.scripts]
god = "god_ai.cli:main"
aura = "god_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
god_ai = ["static/*.html"]